# Nixpacks configuration for YardFlow EventOps
# NOTE: Build commands are handled by railway.json buildCommand
# This file only configures the environment and caching

[phases.setup]
nixPkgs = ["nodejs_20"]

# Disable npm cache to force fresh install after Prisma 7 upgrade
# Re-enable after successful deploy
[caches]
next = "eventops/.next/cache"
